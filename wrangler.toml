name = "tiouo-web"
main = "src/worker.js"
compatibility_date = "2026-08-20"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[routes]]
pattern = "chilo.top/*"
zone_name = "chilo.top"

[[routes]]
pattern = "www.chilo.top/*"
zone_name = "chilo.top"
